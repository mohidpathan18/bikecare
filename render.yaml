services:
  - type: web
    name: bikecare
    runtime: docker
    healthCheckPath: /api/health
    disk:
      name: bikecare-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BIKECARE_DB
        value: /var/data/bikecare.db
      - key: COOKIE_SECURE
        value: "true"
      - key: BIKECARE_ADMIN_EMAIL
        sync: false
      - key: BIKECARE_ADMIN_PASSWORD
        sync: false
